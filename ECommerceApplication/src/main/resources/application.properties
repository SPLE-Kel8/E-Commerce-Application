#db config for deployment on server
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#ORM s/w specific properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

#For Spring Boot 3.x
#spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

#debug logs
logging.level.org.springframework.security=debug

#image
project.image=images/
#spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#JWT Security Key
jwt_secret=cl$ksc^nas%lkdm!cz@xclk#as&dmka;s28*392da%jskd#n9827@3498%

#Swagger OpenAPI
#For sorting endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha

#For sorting tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha

#to remove doc expansion
springdoc.swagger-ui.doc-expansion=false

# ==================== FEATURE FLAGS (Clone-and-Own SPLE) ====================
# Enable/disable features for different product variants

# Payment Features
app.payment.bank-transfer.enabled=true
app.payment.credit-card.enabled=false
app.payment.e-wallet.enabled=false

# Promo Code Feature
app.feature.promo-code.enabled=true

# Discount Feature (product-level discount)
app.feature.product-discount.enabled=true

# ==================== PAYMENT CONFIGURATION ====================
# Bank transfer account details
app.payment.bank-transfer.bank-name=Bank Central
app.payment.bank-transfer.account-number=1234567890
app.payment.bank-transfer.account-name=E-Commerce Store