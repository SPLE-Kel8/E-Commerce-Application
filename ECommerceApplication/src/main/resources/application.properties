#db config for deployment on server
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#For Spring Boot 3.x
#spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

#debug logs
logging.level.org.springframework.security=debug

#image
project.image=images/
#spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#JWT Security Key
jwt_secret=cl$ksc^nas%lkdm!cz@xclk#as&dmka;s28*392da%jskd#n9827@3498%

#Swagger OpenAPI
#For sorting endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha

#For sorting tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha

#to remove doc expansion
springdoc.swagger-ui.doc-expansion=false

# ==================== FEATURE FLAGS (Clone-and-Own SPLE) ====================
# Enable/disable features for different product variants

# Payment Features
app.payment.bank-transfer.enabled=true
app.payment.credit-card.enabled=false
app.payment.e-wallet.enabled=false

# Promo Code Feature
app.feature.promo-code.enabled=true

# Discount Feature (product-level discount)
app.feature.product-discount.enabled=true

# ==================== PAYMENT CONFIGURATION ====================
# Bank transfer accounts (customer selects bank, system returns account number)
# Format: BANK_CODE:BANK_NAME:ACCOUNT_NUMBER:ACCOUNT_NAME
app.payment.bank-transfer.supported-banks=BCA:Bank Central Asia:1234567890:Toko E-Commerce,\
  BNI:Bank Negara Indonesia:0987654321:Toko E-Commerce,\
  MANDIRI:Bank Mandiri:1122334455:Toko E-Commerce,\
  BRI:Bank Rakyat Indonesia:5566778899:Toko E-Commerce